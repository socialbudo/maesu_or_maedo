<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투자왕이 되자! - 무한 생존 20턴 에디션</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
        <!-- 헤더 -->
        <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-rose-600 p-6 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight flex items-center justify-center gap-2">
                <i data-lucide="shield-alert" class="w-8 h-8 text-yellow-300"></i> 투자왕이 되자! (20턴 무한생존)
            </h1>
            <p class="text-indigo-200 text-sm mt-1">목표 제한 없이 20턴 동안 최대한 자산을 불려보세요! 언제든 [손절] 가능!</p>
        </div>

        <!-- 메인 대시보드 -->
        <div class="p-6 space-y-5">
            
            <!-- 상단 통계 & 누적 전적 바 -->
            <div class="flex justify-between items-center bg-slate-900/80 px-4 py-3 rounded-xl border border-slate-700 text-xs">
                <div>
                    <span class="text-slate-400">누적 플레이: </span>
                    <span id="statPlays" class="font-bold text-indigo-400">0회</span>
                </div>
                <div>
                    <span class="text-slate-400">최고 자산 기록: </span>
                    <span id="statBest" class="font-bold text-amber-400">100,000원</span>
                </div>
                <button onclick="resetAllData()" class="bg-rose-600/30 hover:bg-rose-600 text-rose-300 hover:text-white px-2.5 py-1 rounded transition border border-rose-500/40">기록 초기화</button>
            </div>

            <!-- 모드 선택 탭 -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setGameMode('spot')" id="btnSpotMode" class="py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm bg-indigo-600 text-white transition flex items-center justify-center gap-1.5 border border-indigo-500">
                    <i data-lucide="trending-up" class="w-4 h-4"></i> 현물 주식 모드 (매수/매도)
                </button>
                <button onclick="setGameMode('future')" id="btnFutureMode" class="py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm bg-slate-700 text-slate-300 transition flex items-center justify-center gap-1.5 border border-slate-600">
                    <i data-lucide="candlestick-chart" class="w-4 h-4"></i> 선물 코인 모드 (롱/숏)
                </button>
            </div>

            <!-- 게임 상태 패널 -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">진행 턴</span>
                    <span id="turnDisplay" class="text-lg font-bold text-amber-400">1 / 20</span>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">보유 현금</span>
                    <span id="cashDisplay" class="text-lg font-bold text-emerald-400">100,000원</span>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-center">
                    <span id="assetTitleLabel" class="text-xs text-slate-400 block">주식 계좌</span>
                    <span id="stockCashDisplay" class="text-lg font-bold text-blue-400">0원</span>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">총 자산</span>
                    <span id="totalAssetDisplay" class="text-lg font-bold text-rose-400">100,000원</span>
                </div>
            </div>

            <!-- 차트 영역 -->
            <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-700 space-y-2">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs font-semibold text-slate-400 flex items-center gap-1">
                        <i data-lucide="line-chart" class="w-3.5 h-3.5"></i> 차트 뷰 스타일
                    </span>
                    <div class="flex gap-1">
                        <button onclick="switchChartStyle('line')" id="btnLineChart" class="px-2.5 py-1 text-xs font-bold rounded bg-indigo-600 text-white transition">선 그래프</button>
                        <button onclick="switchChartStyle('btc')" id="btnBtcChart" class="px-2.5 py-1 text-xs font-bold rounded bg-slate-700 text-slate-300 transition">비트코인 스타일</button>
                    </div>
                </div>
                <div class="h-40 relative">
                    <canvas id="assetChart"></canvas>
                </div>
            </div>

            <!-- 뉴스 & 이벤트 패널 -->
            <div id="newsPanel" class="bg-slate-900 p-4 rounded-xl border border-indigo-500/40 shadow-inner space-y-2">
                <div class="flex items-center gap-2 text-amber-400 font-bold text-base">
                    <i data-lucide="newspaper" class="w-5 h-5 text-amber-500 shrink-0"></i>
                    <span id="newsTitle">시장 대기 중...</span>
                </div>
                <p id="newsDesc" class="text-slate-300 text-xs sm:text-sm leading-relaxed">모드를 선택하고 첫 턴을 시작하세요!</p>
                <div class="pt-2 border-t border-slate-800 flex items-center justify-between">
                    <span class="text-[11px] text-indigo-300 font-medium flex items-center gap-1">
                        <i data-lucide="shield-alert" class="w-3.5 h-3.5 shrink-0"></i> 💡 25% 확률 가짜 뉴스 시스템 적용 중!
                    </span>
                </div>
            </div>

            <!-- [현물 모드] 매수 / 매도 / 존버 / 손절 패널 -->
            <div id="spotControlPanel" class="space-y-3">
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setSpotTab('buy')" id="btnBuyTab" class="py-2.5 rounded-xl font-semibold bg-emerald-600 text-white transition text-xs sm:text-sm flex items-center justify-center gap-1">
                        매수
                    </button>
                    <button onclick="setSpotTab('sell')" id="btnSellTab" class="py-2.5 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 transition text-xs sm:text-sm flex items-center justify-center gap-1">
                        매도
                    </button>
                    <button onclick="executeSpotAction('stay')" class="py-2.5 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 transition text-xs sm:text-sm flex items-center justify-center gap-1">
                        존버
                    </button>
                    <button onclick="triggerStopLoss()" class="py-2.5 rounded-xl font-bold bg-rose-700 hover:bg-rose-600 text-white transition text-xs sm:text-sm flex items-center justify-center gap-1 shadow-lg shadow-rose-900/30">
                        🚨 손절
                    </button>
                </div>
                <div class="flex gap-2 items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-700">
                    <span id="spotInputLabel" class="text-xs text-slate-400 whitespace-nowrap">매수 금액:</span>
                    <input type="number" id="spotAmountInput" placeholder="금액 입력 (비워두면 전액)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="submitSpotAction()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition shrink-0">실행</button>
                </div>
            </div>

            <!-- [선물 모드] 롱 / 숏 / 손절 패널 (기본 숨김) -->
            <div id="futureControlPanel" class="space-y-3 hidden">
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="selectPosition('LONG')" id="btnLong" class="py-2.5 px-2 rounded-xl font-extrabold bg-emerald-600 text-white transition text-xs sm:text-sm flex items-center justify-center gap-1 border border-emerald-500 shadow">
                        🟢 롱 (상승)
                    </button>
                    <button onclick="selectPosition('SHORT')" id="btnShort" class="py-2.5 px-2 rounded-xl font-extrabold bg-slate-700 hover:bg-rose-600/50 transition text-xs sm:text-sm flex items-center justify-center gap-1 border border-slate-600">
                        🔴 숏 (하락)
                    </button>
                    <button onclick="triggerStopLoss()" class="py-2.5 px-2 rounded-xl font-bold bg-rose-700 hover:bg-rose-600 text-white transition text-xs sm:text-sm flex items-center justify-center gap-1 shadow-lg shadow-rose-900/30">
                        🚨 손절
                    </button>
                </div>
                <div class="flex gap-2 items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-700">
                    <span id="futurePositionIndicator" class="text-xs font-bold text-emerald-400 whitespace-nowrap bg-slate-800 px-2.5 py-1 rounded">선택: 롱</span>
                    <input type="number" id="futureAmountInput" placeholder="투자 금액 입력 (비워두면 전액)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="executeFutureAction()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition shrink-0">진입</button>
                </div>
            </div>

            <!-- 결과 로그 -->
            <div id="resultLog" class="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-lg border border-slate-800 min-h-[45px] flex items-center leading-relaxed">
                모드를 선택하고 첫 번째 투자를 진행하세요!
            </div>
        </div>
    </div>

    <!-- 게임 종료 모달 -->
    <div id="endModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl text-center space-y-4">
            <h2 id="modalTitle" class="text-2xl font-bold">게임 종료</h2>
            <div id="rankBadge" class="inline-block px-4 py-1.5 rounded-full text-base font-extrabold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">등급: -</div>
            <p id="modalDesc" class="text-slate-300 text-sm leading-relaxed">결과 내용</p>
            <button onclick="restartGame()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition">다음 판 도전하기</button>
        </div>
    </div>

    <script>
        let stats = JSON.parse(localStorage.getItem('investment_stats_v2')) || { plays: 0, bestAsset: 100000 };

        let gameMode = 'spot'; 
        let turn = 1;
        let cash = 100000;
        let subAccount = 0; 
        let stockPrice = 10000;
        let assetHistory = [100000];
        let chartStyle = 'line';
        let spotTab = 'buy'; 
        let futurePos = 'LONG'; 

        const newsPool = [
            { title: "🚀 꿈의 신기술 특허 최종 승인!", desc: "A사가 혁신적인 배터리 특허를 취득하며 폭등 조짐이 보입니다.", min: 10, max: 40 },
            { title: "💼 글로벌 대기업과 5조 원 공급 계약!", desc: "거대 빅테크 기업이 A사의 제품을 단독 채택했습니다.", min: 15, max: 45 },
            { title: "🏛️ 정부의 파격적인 세제 면제 및 보조금 혜택", desc: "국가대표 유망 기업으로 선정되어 막대한 지원금을 받습니다.", min: 10, max: 30 },
            { title: "🔥 메인 공장 대형 화재 발생 (생산 중단)", desc: "핵심 생산 라인이 불타버려 주가 폭락 위기에 처했습니다.", min: -40, max: -15 },
            { title: "⚖️ 대표이사 긴급 구속 및 비리 수사", desc: "오너 리스크가 터지면서 거센 충격파가 몰아칩니다.", min: -45, max: -20 },
            { title: "🦠 창사 이래 최악의 개인정보 유출", desc: "해킹 공격으로 집단 소송 위기에 처했습니다.", min: -35, max: -15 },
            { title: "📊 어닝 서프라이즈! 영업이익 300% 폭증", desc: "시장 예상치를 뛰어넘는 역대급 실적입니다.", min: 12, max: 40 },
            { title: "📉 주요 기관 투자자들의 전량 매도 폭탄", desc: "큰손들이 물량을 던지며 하방 압력이 거세졌습니다.", min: -35, max: -10 }
        ];

        let currentNews = null;
        let chart;

        function initChart() {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: chartStyle === 'btc' ? 'bar' : 'line',
                data: {
                    labels: assetHistory.map((_, i) => i === 0 ? '시작' : i),
                    datasets: [{
                        label: '총 자산',
                        data: assetHistory,
                        borderColor: '#6366f1',
                        backgroundColor: chartStyle === 'btc' ? 'rgba(59, 130, 246, 0.5)' : 'rgba(99, 102, 241, 0.1)',
                        borderWidth: 2,
                        fill: chartStyle !== 'btc',
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
                    }
                }
            });
        }

        function switchChartStyle(style) {
            chartStyle = style;
            document.getElementById('btnLineChart').className = style === 'line' ? "px-2.5 py-1 text-xs font-bold rounded bg-indigo-600 text-white transition" : "px-2.5 py-1 text-xs font-bold rounded bg-slate-700 text-slate-300 transition";
            document.getElementById('btnBtcChart').className = style === 'btc' ? "px-2.5 py-1 text-xs font-bold rounded bg-indigo-600 text-white transition" : "px-2.5 py-1 text-xs font-bold rounded bg-slate-700 text-slate-300 transition";
            initChart();
            updateUI();
        }

        function setGameMode(mode) {
            gameMode = mode;
            const btnSpot = document.getElementById('btnSpotMode');
            const btnFuture = document.getElementById('btnFutureMode');
            const spotPanel = document.getElementById('spotControlPanel');
            const futurePanel = document.getElementById('futureControlPanel');
            const titleLabel = document.getElementById('assetTitleLabel');

            if (mode === 'spot') {
                btnSpot.className = "py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm bg-indigo-600 text-white transition flex items-center justify-center gap-1.5 border border-indigo-500";
                btnFuture.className = "py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm bg-slate-700 text-slate-300 transition flex items-center justify-center gap-1.5 border border-slate-600";
                spotPanel.classList.remove('hidden');
                futurePanel.classList.add('hidden');
                titleLabel.innerText = "주식 계좌";
            } else {
                btnSpot.className = "py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm bg-slate-700 text-slate-300 transition flex items-center justify-center gap-1.5 border border-slate-600";
                btnFuture.className = "py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm bg-purple-600 text-white transition flex items-center justify-center gap-1.5 border border-purple-500";
                spotPanel.classList.add('hidden');
                futurePanel.classList.remove('hidden');
                titleLabel.innerText = "선물 포지션";
            }
            restartGame();
        }

        function setSpotTab(tab) {
            spotTab = tab;
            const bTab = document.getElementById('btnBuyTab');
            const sTab = document.getElementById('btnSellTab');
            const label = document.getElementById('spotInputLabel');
            if (tab === 'buy') {
                bTab.className = "py-2.5 rounded-xl font-semibold bg-emerald-600 text-white transition text-xs sm:text-sm flex items-center justify-center gap-1";
                sTab.className = "py-2.5 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 transition text-xs sm:text-sm flex items-center justify-center gap-1";
                label.innerText = "매수 금액:";
            } else {
                bTab.className = "py-2.5 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 transition text-xs sm:text-sm flex items-center justify-center gap-1";
                sTab.className = "py-2.5 rounded-xl font-semibold bg-blue-600 text-white transition text-xs sm:text-sm flex items-center justify-center gap-1";
                label.innerText = "매도 금액:";
            }
        }

        function selectPosition(pos) {
            futurePos = pos;
            const bLong = document.getElementById('btnLong');
            const bShort = document.getElementById('btnShort');
            const indicator = document.getElementById('futurePositionIndicator');
            if (pos === 'LONG') {
                bLong.className = "py-2.5 px-2 rounded-xl font-extrabold bg-emerald-600 text-white transition text-xs sm:text-sm flex items-center justify-center gap-1 border border-emerald-500 shadow";
                bShort.className = "py-2.5 px-2 rounded-xl font-extrabold bg-slate-700 hover:bg-rose-600/50 transition text-xs sm:text-sm flex items-center justify-center gap-1 border border-slate-600";
                indicator.innerText = "선택: 롱";
                indicator.className = "text-xs font-bold text-emerald-400 whitespace-nowrap bg-slate-800 px-2.5 py-1 rounded";
            } else {
                bLong.className = "py-2.5 px-2 rounded-xl font-extrabold bg-slate-700 hover:bg-emerald-600/50 transition text-xs sm:text-sm flex items-center justify-center gap-1 border border-slate-600";
                bShort.className = "py-2.5 px-2 rounded-xl font-extrabold bg-rose-600 text-white transition text-xs sm:text-sm flex items-center justify-center gap-1 border border-rose-500 shadow";
                indicator.innerText = "선택: 숏";
                indicator.className = "text-xs font-bold text-rose-400 whitespace-nowrap bg-slate-800 px-2.5 py-1 rounded";
            }
        }

        function pickNewNews() {
            currentNews = newsPool[Math.floor(Math.random() * newsPool.length)];
            document.getElementById('newsTitle').innerText = currentNews.title;
            document.getElementById('newsDesc').innerText = currentNews.desc;
        }

        function submitSpotAction() {
            const val = document.getElementById('spotAmountInput').value;
            const amount = val === "" ? null : parseInt(val);
            let logMsg = "";

            if (spotTab === 'buy') {
                let invest = (amount === null) ? cash : amount;
                if (cash <= 0) logMsg = "❌ 현금이 없어 매수할 수 없습니다! (존버 처리)";
                else if (invest > 0 && invest <= cash) {
                    cash -= invest;
                    subAccount += invest;
                    logMsg = `✅ 주식 계좌에 ${invest.toLocaleString()}원을 투입했습니다.`;
                } else logMsg = "❌ 금액 오류로 존버 처리됩니다.";
            } else {
                let divest = (amount === null) ? subAccount : amount;
                if (subAccount <= 0) logMsg = "❌ 주식 계좌에 잔액이 없습니다! (존버 처리)";
                else if (divest > 0 && divest <= subAccount) {
                    subAccount -= divest;
                    cash += divest;
                    logMsg = `✅ 주식 계좌에서 ${divest.toLocaleString()}원을 현금화했습니다.`;
                } else logMsg = "❌ 금액 오류로 존버 처리됩니다.";
            }
            document.getElementById('spotAmountInput').value = "";
            processTurn(logMsg);
        }

        function executeFutureAction() {
            const val = document.getElementById('futureAmountInput').value;
            const amount = val === "" ? (cash + subAccount) : parseInt(val);

            if (cash <= 0 && subAccount <= 0) {
                document.getElementById('resultLog').innerText = "❌ 자산이 없어 포지션을 잡을 수 없습니다!";
                return;
            }
            if (isNaN(amount) || amount <= 0 || amount > cash + subAccount) {
                document.getElementById('resultLog').innerText = "❌ 올바른 투자 금액을 입력해주세요.";
                return;
            }

            let total = cash + subAccount;
            cash = total - amount;
            subAccount = amount;
            document.getElementById('futureAmountInput').value = "";
            processTurn(`[${futurePos} 포지션 진입]`);
        }

        function executeSpotAction(action) {
            if (action === 'stay') {
                processTurn("🧘 시장을 관망하며 존버합니다.");
            }
        }

        // 손절 버튼 기능: 주식 계좌/선물 포지션에 들어있는 금액을 전액 환급받고 게임 즉시 종료
        function triggerStopLoss() {
            let totalAsset = cash + subAccount;
            cash = totalAsset;
            subAccount = 0;
            
            stats.plays++;
            if (totalAsset > stats.bestAsset) {
                stats.bestAsset = totalAsset;
            }
            localStorage.setItem('investment_stats_v2', JSON.stringify(stats));

            showModal("🚨 손절 선언 (게임 종료)", totalAsset, true);
        }

        function processTurn(actionLog) {
            const isFake = Math.random() < 0.25;
            let rawPct = (Math.random() * (currentNews.max - currentNews.min) + currentNews.min);
            if (isFake) rawPct = -rawPct;
            const fluctuation = Math.round(rawPct * 10) / 10;

            let pnlPct = fluctuation;
            if (gameMode === 'future' && futurePos === 'SHORT') {
                pnlPct = -fluctuation;
            }

            if (subAccount > 0) {
                let change = Math.round(subAccount * (pnlPct / 100));
                subAccount += change;
                if (subAccount < 0) subAccount = 0;
            }

            stockPrice = Math.max(100, Math.round(stockPrice * (1 + fluctuation / 100)));
            let totalAsset = cash + subAccount;
            assetHistory.push(totalAsset);

            let resultHtml = `${actionLog} 시장 변동: <b class="${fluctuation >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${fluctuation > 0 ? '+' + fluctuation : fluctuation}%</b><br>`;
            if (isFake) {
                resultHtml += `🚨 <b class="text-amber-400">[25% 가짜 뉴스 반전!]</b> (수익률: <b class="${pnlPct >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnlPct > 0 ? '+' + pnlPct : pnlPct}%</b>)`;
            } else {
                resultHtml += `✨ <b class="text-blue-400">[진짜 뉴스 적중!]</b> (수익률: <b class="${pnlPct >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnlPct > 0 ? '+' + pnlPct : pnlPct}%</b>)`;
            }

            document.getElementById('resultLog').innerHTML = resultHtml;

            updateUI();
            checkGameCondition(totalAsset);

            if (turn <= 20 && totalAsset > 0) {
                pickNewNews();
            }
        }

        function updateUI() {
            let totalAsset = cash + subAccount;
            document.getElementById('turnDisplay').innerText = `${turn} / 20`;
            document.getElementById('cashDisplay').innerText = `${cash.toLocaleString()}원`;
            document.getElementById('stockCashDisplay').innerText = `${subAccount.toLocaleString()}원`;
            document.getElementById('totalAssetDisplay').innerText = `${totalAsset.toLocaleString()}원`;

            document.getElementById('statPlays').innerText = `${stats.plays}회`;
            document.getElementById('statBest').innerText = `${stats.bestAsset.toLocaleString()}원`;

            chart.data.labels = assetHistory.map((_, i) => i === 0 ? '시작' : i);
            chart.data.datasets[0].data = assetHistory;
            chart.update();
        }

        function getRank(totalAsset) {
            if (totalAsset >= 500000) return { grade: "S+", color: "bg-yellow-500/20 text-yellow-300 border-yellow-500/40", title: "S+등급: 살아있는 투자 전설 👑" };
            if (totalAsset >= 300000) return { grade: "S", color: "bg-yellow-600/20 text-yellow-200 border-yellow-600/40", title: "S등급: 월스트리트의 제왕 🦅" };
            if (totalAsset >= 200000) return { grade: "A", color: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40", title: "A등급: 천재적 투자 고수 🌟" };
            if (totalAsset >= 150000) return { grade: "B", color: "bg-blue-500/20 text-blue-300 border-blue-500/40", title: "B등급: 우상향 탑승 성공 📈" };
            if (totalAsset >= 100000) return { grade: "C", color: "bg-slate-500/20 text-slate-300 border-slate-500/40", title: "C등급: 본전 지킴이 😐" };
            if (totalAsset > 0) return { grade: "D", color: "bg-orange-500/20 text-orange-300 border-orange-500/40", title: "D등급: 원금 까먹은 개미 💧" };
            return { grade: "F", color: "bg-rose-500/20 text-rose-300 border-rose-500/40", title: "F등급: 투자는 당장 접으세요! 💀" };
        }

        function checkGameCondition(totalAsset) {
            if (totalAsset <= 0 || turn >= 20) {
                stats.plays++;
                if (totalAsset > stats.bestAsset) {
                    stats.bestAsset = totalAsset;
                }
                localStorage.setItem('investment_stats_v2', JSON.stringify(stats));

                let title = totalAsset <= 0 ? "💸 파산 (게임 오버)" : "⏰ 20턴 장 마감!";
                showModal(title, totalAsset, false);
                return;
            }
            turn++;
        }

        function showModal(title, totalAsset, isStopLoss = false) {
            const rank = getRank(totalAsset);
            document.getElementById('modalTitle').innerText = isStopLoss ? "🚨 손절 정산 완료" : title;
            const badge = document.getElementById('rankBadge');
            badge.className = `inline-block px-4 py-1.5 rounded-full text-base font-extrabold border ${rank.color}`;
            badge.innerText = rank.title;

            let diff = totalAsset - 100000;
            let profitStr = diff >= 0 ? `+${diff.toLocaleString()}원 수익` : `${diff.toLocaleString()}원 손실`;
            let extraMsg = isStopLoss ? "\n(원금을 전액 현금화하고 안전하게 탈출했습니다!)" : "";
            
            document.getElementById('modalDesc').innerText = `최종 자산: ${totalAsset.toLocaleString()}원 (${profitStr})${extraMsg}\n누적 플레이 횟수: ${stats.plays}회 | 최고 기록: ${stats.bestAsset.toLocaleString()}원`;

            document.getElementById('endModal').classList.remove('hidden');
            document.getElementById('endModal').classList.add('flex');
            document.getElementById('spotControlPanel').style.display = 'none';
            document.getElementById('futureControlPanel').style.display = 'none';
        }

        function restartGame() {
            turn = 1;
            cash = 100000;
            subAccount = 0;
            stockPrice = 10000;
            assetHistory = [100000];
            document.getElementById('endModal').classList.remove('flex');
            document.getElementById('endModal').classList.add('hidden');
            
            if (gameMode === 'spot') {
                document.getElementById('spotControlPanel').style.display = 'block';
            } else {
                document.getElementById('futureControlPanel').style.display = 'block';
            }

            document.getElementById('resultLog').innerText = "새로운 투자가 시작되었습니다! 전략을 세우세요.";
            pickNewNews();
            initChart();
            updateUI();
        }

        function resetAllData() {
            if (confirm("누적 기록을 모두 초기화하시겠습니까?")) {
                localStorage.removeItem('investment_stats_v2');
                stats = { plays: 0, bestAsset: 100000 };
                updateUI();
                alert("초기화되었습니다!");
            }
        }

        window.onload = () => {
            lucide.createIcons();
            initChart();
            pickNewNews();
            updateUI();
        };
    </script>
</body>
</html>
