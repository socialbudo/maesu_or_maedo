<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투자왕이 되자! - 의심과 혼돈의 월스트리트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
        <!-- 헤더 -->
        <div class="bg-gradient-to-r from-purple-600 via-indigo-600 to-rose-600 p-6 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight flex items-center justify-center gap-2">
                <i data-lucide="help-circle" class="w-8 h-8 animate-bounce"></i> 투자왕이 되자! (의심의 심리학)
            </h1>
            <p class="text-indigo-200 text-sm mt-1">대공황일까? 역대급 호재일까? 모든 뉴스는 거짓일 수 있습니다!</p>
        </div>

        <!-- 게임 상태 대시보드 -->
        <div class="p-6 space-y-6">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">진행 턴</span>
                    <span id="turnDisplay" class="text-xl font-bold text-indigo-400">1 / 15</span>
                </div>
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">보유 현금</span>
                    <span id="cashDisplay" class="text-xl font-bold text-emerald-400">100,000원</span>
                </div>
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">주식 계좌</span>
                    <span id="stockCashDisplay" class="text-xl font-bold text-blue-400">0원</span>
                </div>
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">총 자산</span>
                    <span id="totalAssetDisplay" class="text-xl font-bold text-amber-400">100,000원</span>
                </div>
            </div>

            <!-- 자산 변화 그래프 -->
            <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-700 h-44">
                <canvas id="assetChart"></canvas>
            </div>

            <!-- 뉴스 & 이벤트 패널 -->
            <div id="newsPanel" class="bg-slate-900 p-5 rounded-xl border border-purple-500/40 shadow-inner space-y-2">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 text-rose-400 font-extrabold text-lg">
                        <i data-lucide="radio" class="w-5 h-5 text-rose-500 animate-pulse"></i>
                        <span id="newsTitle">시장 심리 파악 중...</span>
                    </div>
                </div>
                <p id="newsDesc" class="text-slate-300 text-sm leading-relaxed">버튼을 눌러 매수/매도/존버를 결정하세요!</p>
                <div class="pt-2 border-t border-slate-800 flex items-center justify-between">
                    <span class="text-xs text-amber-400 font-semibold flex items-center gap-1">
                        <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> ⚠️ 주의: 모든 뉴스에는 가짜 뉴스(찌라시) 확률이 포함되어 있습니다!
                    </span>
                </div>
            </div>

            <!-- 컨트롤 패널 (액션 입력) -->
            <div id="controlPanel" class="space-y-4">
                <div class="flex gap-2">
                    <button onclick="setMode('buy')" id="btnBuyTab" class="flex-1 py-2.5 rounded-xl font-semibold bg-emerald-600 hover:bg-emerald-500 transition text-sm flex items-center justify-center gap-1">
                        <i data-lucide="arrow-down-circle" class="w-4 h-4"></i> 매수 (현금 ➔ 주식)
                    </button>
                    <button onclick="setMode('sell')" id="btnSellTab" class="flex-1 py-2.5 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 transition text-sm flex items-center justify-center gap-1">
                        <i data-lucide="arrow-up-circle" class="w-4 h-4"></i> 매도 (주식 ➔ 현금)
                    </button>
                    <button onclick="doAction('stay')" class="flex-1 py-2.5 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 transition text-sm flex items-center justify-center gap-1">
                        <i data-lucide="shield" class="w-4 h-4"></i> 존버
                    </button>
                </div>

                <div id="inputBoxContainer" class="flex gap-2 items-center bg-slate-900/80 p-3 rounded-xl border border-slate-700">
                    <span id="inputLabel" class="text-xs text-slate-400 whitespace-nowrap">매수 금액:</span>
                    <input type="number" id="actionAmount" placeholder="금액 입력 (비워두면 전액)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                    <button onclick="submitAction()" class="bg-purple-600 hover:bg-purple-500 px-5 py-1.5 rounded-lg text-sm font-bold transition">결정</button>
                </div>
            </div>

            <!-- 결과 로그 -->
            <div id="resultLog" class="text-xs text-slate-400 bg-slate-900/50 p-3 rounded-lg border border-slate-800 min-h-[50px] flex items-center leading-relaxed">
                시장의 소문에 속지 마세요! 진짜인지 가짜인지 판단하고 투자하세요.
            </div>
        </div>
    </div>

    <!-- 게임 종료 모달 -->
    <div id="endModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl text-center space-y-4">
            <h2 id="modalTitle" class="text-2xl font-bold">게임 종료</h2>
            <p id="modalDesc" class="text-slate-300 text-sm">결과 내용</p>
            <button onclick="restartGame()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 font-bold rounded-xl transition">다시 도전하기</button>
        </div>
    </div>

    <script>
        let turn = 1;
        let cash = 100000;
        let stockCash = 0;
        let stockPrice = 10000;
        let currentMode = 'buy';
        let assetHistory = [100000];

        // 대공황? 호재? 형태의 극단적 대조 뉴스 헤드라인 리스트
        const paradoxicalNewsList = [
            { title: "😱 대공황의 서막? 아니면 🚀 역대급 초대형 호재?", desc: "A사가 비밀리에 추진하던 핵심 사업의 결과 발표가 임박했습니다. 증권가는 극과 극의 전망을 내놓는 중!", baseMin: 10, baseMax: 35 },
            { title: "💥 회사 붕괴 위기? 아니면 💎 세력의 마지막 개미 털기?", desc: "대표이사의 비리 찌라시가 유포되며 주가가 요동칩니다. 악의적인 루머일까요, 진짜 스캔들일까요?", baseMin: -35, baseMax: -10 },
            { title: "📉 대침체의 늪? 아니면 📈 바닥 치고 10배 폭등 전조?", desc: "세계 경제 위기설이 퍼지는 가운데, A사만 홀로 신제품 수주에 성공했다는 미확인 유출문서가 떠돌아다닙니다.", baseMin: 8, baseMax: 30 },
            { title: "⚠️ 상장폐지 절차 착수? 아니면 🤝 10조 원 인수합병 체결?", desc: "공시가 뜨기 직전! 시장에는 극단적인 찬반 소문이 번지며 투자자들의 멘탈을 흔들고 있습니다.", baseMin: -40, baseMax: 40 },
            { title: "🔥 공장 잿더미 폭망? 아니면 🏆 보험금 100배 대박 호재?", desc: "메인 공장에서 화재가 발생했다는 긴급 타전! 그러나 어마어마한 화재 보험에 가입되어 있다는 소문도 함께 돕니다.", baseMin: -25, baseMax: 25 },
            { title: "🩸 피바다 떡락장? 아니면 🚀 세력의 숏스퀴즈 폭등 파티?", desc: "외국인 투자자들이 전량 매도하고 도망쳤다는 찌라시가 돌고 있습니다. 진짜일까요?", baseMin: -30, baseMax: 30 }
        ];

        let currentNews = null;
        let chart;

        function initChart() {
            const ctx = document.getElementById('assetChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['시작'],
                    datasets: [{
                        label: '총 자산',
                        data: assetHistory,
                        borderColor: '#a855f7',
                        backgroundColor: 'rgba(168, 85, 247, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
                    }
                }
            });
        }

        function pickNewNews() {
            currentNews = paradoxicalNewsList[Math.floor(Math.random() * paradoxicalNewsList.length)];
            document.getElementById('newsTitle').innerText = currentNews.title;
            document.getElementById('newsDesc').innerText = currentNews.desc;
        }

        function setMode(mode) {
            currentMode = mode;
            const btnBuy = document.getElementById('btnBuyTab');
            const btnSell = document.getElementById('btnSellTab');
            const label = document.getElementById('inputLabel');

            if (mode === 'buy') {
                btnBuy.className = "flex-1 py-2.5 rounded-xl font-semibold bg-emerald-600 hover:bg-emerald-500 transition text-sm flex items-center justify-center gap-1";
                btnSell.className = "flex-1 py-2.5 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 transition text-sm flex items-center justify-center gap-1";
                label.innerText = "매수 금액:";
            } else {
                btnBuy.className = "flex-1 py-2.5 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 transition text-sm flex items-center justify-center gap-1";
                btnSell.className = "flex-1 py-2.5 rounded-xl font-semibold bg-blue-600 hover:bg-blue-500 transition text-sm flex items-center justify-center gap-1";
                label.innerText = "매도 금액:";
            }
        }

        function submitAction() {
            const val = document.getElementById('actionAmount').value;
            const amount = val === "" ? null : parseInt(val);
            doAction(currentMode, amount);
        }

        function doAction(actionType, amount = null) {
            let logMsg = "";
            if (actionType === 'buy') {
                const invest = (amount === null) ? cash : amount;
                if (cash <= 0) {
                    logMsg = "❌ 현금이 없어 매수할 수 없습니다! (존버 처리)";
                } else if (invest > 0 && invest <= cash) {
                    cash -= invest;
                    stockCash += invest;
                    logMsg = `✅ 주식 계좌에 ${invest.toLocaleString()}원을 투입했습니다.`;
                } else {
                    logMsg = "❌ 올바르지 않은 금액입니다. (존버 처리)";
                }
            } else if (actionType === 'sell') {
                const divest = (amount === null) ? stockCash : amount;
                if (stockCash <= 0) {
                    logMsg = "❌ 주식 계좌에 잔액이 없습니다! (존버 처리)";
                } else if (divest > 0 && divest <= stockCash) {
                    stockCash -= divest;
                    cash += divest;
                    logMsg = `✅ 주식 계좌에서 ${divest.toLocaleString()}원을 현금화했습니다.`;
                } else {
                    logMsg = "❌ 올바르지 않은 금액입니다. (존버 처리)";
                }
            } else {
                logMsg = "🧘 시장의 소문을 무시하고 존버합니다.";
            }

            document.getElementById('actionAmount').value = "";
            processTurn(logMsg);
        }

        function processTurn(actionLog) {
            // 모든 턴 무작위 가짜 뉴스 시스템 적용 (40% 확률로 가짜 뉴스 판정!)
            const isFake = Math.random() < 0.4;
            
            // 기본 변동률 계산
            let rawPct = (Math.random() * (currentNews.baseMax - currentNews.baseMin) + currentNews.baseMin);
            
            // 가짜 뉴스의 경우 방향이 뒤집힘!
            if (isFake) {
                rawPct = -rawPct;
            }
            const fluctuation = Math.round(rawPct * 10) / 10;

            // 주식 계좌 금액 및 주가 반영
            if (stockCash > 0) {
                let change = Math.round(stockCash * (fluctuation / 100));
                stockCash += change;
                if (stockCash < 0) stockCash = 0;
            }
            stockPrice = Math.max(100, Math.round(stockPrice * (1 + fluctuation / 100)));

            let totalAsset = cash + stockCash;
            assetHistory.push(totalAsset);

            // 결과 로그 메시지 조합
            let resultHtml = `${actionLog}<br>`;
            if (isFake) {
                resultHtml += `🚨 <b class="text-amber-400">[가짜 뉴스 판명!]</b> 소문은 세력의 속임수였습니다! 주가 <b class="${fluctuation >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${fluctuation > 0 ? '+' + fluctuation : fluctuation}%</b> 변동!`;
            } else {
                resultHtml += `✨ <b class="text-blue-400">[진짜 뉴스 판명!]</b> 소문이 사실로 드러났습니다! 주가 <b class="${fluctuation >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${fluctuation > 0 ? '+' + fluctuation : fluctuation}%</b> 변동!`;
            }

            document.getElementById('resultLog').innerHTML = resultHtml;

            // 다음 턴 뉴스 준비 & UI 업데이트
            updateUI();
            checkGameCondition(totalAsset);
            
            if (turn <= 15 && totalAsset > 0 && totalAsset < 300000) {
                pickNewNews();
            }
        }

        function updateUI() {
            let totalAsset = cash + stockCash;
            document.getElementById('turnDisplay').innerText = `${turn} / 15`;
            document.getElementById('cashDisplay').innerText = `${cash.toLocaleString()}원`;
            document.getElementById('stockCashDisplay').innerText = `${stockCash.toLocaleString()}원`;
            document.getElementById('totalAssetDisplay').innerText = `${totalAsset.toLocaleString()}원`;

            chart.data.labels.push(turn);
            chart.data.datasets[0].data = assetHistory;
            chart.update();
        }

        function checkGameCondition(totalAsset) {
            if (totalAsset <= 0) {
                showModal("💸 깡통 계좌 달성 (파산!)", "가짜 뉴스에 낚여 전 재산을 잃었습니다... 다음엔 더 신중하게 투자해 보세요!");
                return;
            }
            if (totalAsset >= 300000) {
                showModal("🏆 전설의 심리전 투자왕!", `축하합니다! 소문의 진위를 파악하고 30만 원을 돌파하셨습니다! (최종 자산: ${totalAsset.toLocaleString()}원)`);
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                return;
            }

            turn++;
            if (turn > 15) {
                let diff = totalAsset - 100000;
                let msg = diff >= 0 ? `+${diff.toLocaleString()}원 수익 달성!` : `${diff.toLocaleString()}원 손실 기록.`;
                showModal("⏰ 15턴 장 마감!", `15회의 치열한 장이 끝났습니다. 최종 자산: ${totalAsset.toLocaleString()}원 (${msg})`);
            }
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('endModal').classList.remove('hidden');
            document.getElementById('endModal').classList.add('flex');
            document.getElementById('controlPanel').style.display = 'none';
        }

        function restartGame() {
            turn = 1;
            cash = 100000;
            stockCash = 0;
            stockPrice = 10000;
            assetHistory = [100000];
            document.getElementById('endModal').classList.remove('flex');
            document.getElementById('endModal').classList.add('hidden');
            document.getElementById('controlPanel').style.display = 'block';
            document.getElementById('resultLog').innerText = "시장의 소문에 속지 마세요! 진짜인지 가짜인지 판단하고 투자하세요.";
            pickNewNews();
            initChart();
            updateUI();
        }

        window.onload = () => {
            lucide.createIcons();
            initChart();
            pickNewNews();
            updateUI();
        };
    </script>
</body>
</html>
