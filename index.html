<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투자왕이 되자! : 서바이벌 에디션</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

    <div class="max-w-4xl mx-auto w-full space-y-6">
        <!-- 헤더 -->
        <header class="flex justify-between items-center bg-slate-800/80 backdrop-blur p-4 rounded-2xl border border-slate-700 shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500/20 p-2.5 rounded-xl text-amber-400">
                    <i data-lucide="trending-up" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl tracking-tight text-white">투자왕이 되자!</h1>
                    <p class="text-xs text-slate-400">15턴 내 파산 없이 30만 원을 달성하세요</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-slate-900/60 px-4 py-2 rounded-xl border border-slate-700/50">
                <span class="text-xs text-slate-400 font-semibold">턴</span>
                <span id="turnDisplay" class="font-bold text-amber-400 text-lg">1 / 15</span>
            </div>
        </header>

        <!-- 자산 상황 폰트 및 모멘텀 표시 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50">
                <span class="text-xs text-slate-400 font-medium">💵 보유 현금</span>
                <div id="cashDisplay" class="text-lg md:text-xl font-bold text-emerald-400 mt-1">100,000원</div>
            </div>
            <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50">
                <span class="text-xs text-slate-400 font-medium">📈 주식 평가액</span>
                <div id="stockCashDisplay" class="text-lg md:text-xl font-bold text-blue-400 mt-1">0원</div>
            </div>
            <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50">
                <span class="text-xs text-slate-400 font-medium">💎 총 자산</span>
                <div id="totalAssetDisplay" class="text-lg md:text-xl font-bold text-amber-400 mt-1">100,000원</div>
            </div>
            <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50 flex flex-col justify-between">
                <span class="text-xs text-slate-400 font-medium">🔥 시장 모멘텀</span>
                <div id="momentumDisplay" class="text-sm font-semibold text-slate-300 mt-1 flex items-center space-x-1">
                    <span>중립 (보통)</span>
                </div>
            </div>
        </div>

        <!-- 메인 인터랙션 구역 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 좌측: 뉴스 및 액션 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 뉴스 카드 -->
                <div class="bg-gradient-to-br from-slate-800 to-slate-800/90 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-3 relative overflow-hidden">
                    <div class="flex items-center justify-between border-b border-slate-700/80 pb-2">
                        <div class="flex items-center space-x-2 text-rose-400 text-xs font-bold tracking-wide uppercase">
                            <i data-lucide="newspaper" class="w-4 h-4"></i>
                            <span>긴급 속보</span>
                        </div>
                        <div class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center space-x-1">
                            <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>
                            <span>⚠️ 주의: 가짜 뉴스일 수 있습니다!</span>
                        </div>
                    </div>
                    
                    <div>
                        <h2 id="newsTitle" class="text-lg font-bold text-white tracking-tight">게임 시작 대기 중</h2>
                        <p id="newsDesc" class="text-sm text-slate-300 mt-1 leading-relaxed">버튼을 눌러 첫 턴을 시작해 주세요.</p>
                    </div>
                    
                    <div id="newsResult" class="hidden text-xs font-bold p-3 rounded-xl transition-all"></div>
                </div>

                <!-- 거래 콘솔 -->
                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-200">액션 선택 및 금액 입력</span>
                        <span class="text-xs text-slate-400">직접 금액을 적거나 비율 버튼 클릭</span>
                    </div>

                    <!-- 금액 입력 input -->
                    <div class="relative">
                        <input type="number" id="tradeAmount" placeholder="금액 입력 (예: 5000)" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-colors">
                        <span class="absolute right-4 top-3.5 text-sm text-slate-400">원</span>
                    </div>

                    <!-- 비율 퀵 버튼 -->
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setAmountPercent(0.25)" class="bg-slate-700/50 hover:bg-slate-700 text-xs py-2 rounded-lg text-slate-300 transition">25%</button>
                        <button onclick="setAmountPercent(0.50)" class="bg-slate-700/50 hover:bg-slate-700 text-xs py-2 rounded-lg text-slate-300 transition">50%</button>
                        <button onclick="setAmountPercent(0.75)" class="bg-slate-700/50 hover:bg-slate-700 text-xs py-2 rounded-lg text-slate-300 transition">75%</button>
                        <button onclick="setAmountPercent(1.0)" class="bg-slate-700/50 hover:bg-slate-700 text-xs py-2 rounded-lg text-slate-300 transition">전액 (100%)</button>
                    </div>

                    <!-- 매수 / 존버 / 매도 버튼 -->
                    <div class="grid grid-cols-3 gap-3 pt-2">
                        <button id="buyBtn" onclick="processTurn('buy')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex flex-col items-center justify-center">
                            <span class="text-sm">매수 (Buy)</span>
                            <span class="text-[10px] opacity-80 font-normal">현금 → 주식</span>
                        </button>
                        <button id="holdBtn" onclick="processTurn('hold')" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex flex-col items-center justify-center">
                            <span class="text-sm">존버 (Hold)</span>
                            <span class="text-[10px] opacity-80 font-normal">관망하기</span>
                        </button>
                        <button id="sellBtn" onclick="processTurn('sell')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex flex-col items-center justify-center">
                            <span class="text-sm">매도 (Sell)</span>
                            <span class="text-[10px] opacity-80 font-normal">주식 → 현금</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 우측: 자산 변화 차트 -->
            <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 flex flex-col justify-between">
                <span class="text-sm font-bold text-slate-200 mb-2 block">📊 자산 변화 추이</span>
                <div class="h-64 w-full">
                    <canvas id="assetChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 상태 변수
        let turn = 1;
        let cash = 100000;
        let stockCash = 0;
        let stockPrice = 10000;
        let momentum = 0; // 연속 상승(+)/하락(-) 모멘텀 스택

        // 뉴스 데이터베이스 (진짜/가짜 속성 내포)
        const newsList = [
            { type: 'good', title: "🚀 신제품 대박 품절 대란!", desc: "A사의 신제품 반응이 뜨겁습니다! 매출이 폭발할 것이라는 소문이 돕니다.", min: 8, max: 25 },
            { type: 'good', title: "🤝 글로벌 대기업과 독점 계약 체결?", desc: "세계적 기업과의 계약 체결 소식이 공시되었습니다.", min: 10, max: 30 },
            { type: 'good', title: "💡 정부의 파격적 보조금 지원 발표", "desc": "정부가 A사 관련 산업에 수조 원 규모 조세를 감면해 준다고 합니다.", min: 5, max: 18 },
            { type: 'bad', title: "💥 핵심 공장 대형 화재 발생!", desc: "주력 공장에서 큰 불이 나 생산 라인이 전부 멈췄다고 합니다.", min: -25, max: -8 },
            { type: 'bad', title: "⚖️ 대표이사 사내 횡령 스캔들 터지다", desc: "CEO가 자금을 유용해 검찰 조사를 받는다는 긴급 보도입니다.", min: -30, max: -10 },
            { type: 'bad', title: "📉 경쟁사의 반값 파격 공세", desc: "라이벌 기업이 반값 제품을 내놓으며 점유율을 뺏기고 있습니다.", min: -18, max: -5 },
            { type: 'neutral', title: "📊 분기 실적 발표 (시장 예상 부합)", desc: "특별한 기쁨도 슬픔도 없이 무난한 수치를 보여주었습니다.", min: -4, max: 4 }
        ];

        let currentNews = null;

        // Chart.js 설정
        const ctx = document.getElementById('assetChart').getContext('2d');
        const assetChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['시작'],
                datasets: [{
                    label: '총 자산(원)',
                    data: [100000],
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                    y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                }
            }
        });

        // 초기화
        function initTurn() {
            if (turn > 15) return;
            
            // 뉴스 뽑기
            currentNews = newsList[Math.floor(Math.random() * newsList.length)];
            document.getElementById('newsTitle').innerText = currentNews.title;
            document.getElementById('newsDesc').innerText = currentNews.desc;
            
            document.getElementById('newsResult').classList.add('hidden');
            document.getElementById('tradeAmount').value = '';
            
            updateUI();
        }

        // 비율 버튼 클릭 시 금액 자동 계산
        function setAmountPercent(ratio) {
            const lastChoice = document.querySelector('button.active-action');
            // 현금 기준 or 주식 기준 자동 판별
            const maxAmt = cash > 0 ? cash : stockCash;
            document.getElementById('tradeAmount').value = Math.floor(maxAmt * ratio);
        }

        // 턴 진행 로직
        function processTurn(action) {
            let amtInput = parseInt(document.getElementById('tradeAmount').value) || 0;

            // 매수
            if (action === 'buy') {
                if (cash <= 0) {
                    alert("현금이 없습니다!");
                    return;
                }
                let buyAmt = amtInput > 0 ? Math.min(amtInput, cash) : cash;
                cash -= buyAmt;
                stockCash += buyAmt;
            } 
            // 매도
            else if (action === 'sell') {
                if (stockCash <= 0) {
                    alert("매도할 주식 자산이 없습니다!");
                    return;
                }
                let sellAmt = amtInput > 0 ? Math.min(amtInput, stockCash) : stockCash;
                stockCash -= sellAmt;
                cash += sellAmt;
            }

            // --- 2. 가짜 뉴스 판단 (25% 확률로 찌라시/반대 결과) ---
            const isFake = Math.random() < 0.25;
            let finalType = currentNews.type;
            
            if (isFake) {
                if (currentNews.type === 'good') finalType = 'bad';
                else if (currentNews.type === 'bad') finalType = 'good';
            }

            // 수치 랜덤 산출
            let basePct = 0;
            if (finalType === 'good') {
                basePct = (Math.random() * (currentNews.max - currentNews.min) + currentNews.min);
            } else if (finalType === 'bad') {
                basePct = -(Math.random() * (Math.abs(currentNews.min) - Math.abs(currentNews.max)) + Math.abs(currentNews.max));
            } else {
                basePct = (Math.random() * 8 - 4);
            }

            // --- 4. 모멘텀 시스템 (연속성 반영) ---
            // 이전 턴 변동에 따라 추가 보너스/디버프 (+- 2~5%)
            let momentumBonus = momentum * (Math.random() * 3 + 1);
            let finalPct = +(basePct + momentumBonus).toFixed(1);

            // 모멘텀 스택 업데이트
            if (finalPct > 3) momentum = Math.min(momentum + 1, 3);
            else if (finalPct < -3) momentum = Math.max(momentum - 1, -3);
            else momentum = 0;

            // 주식 자산 변동 반영
            if (stockCash > 0) {
                stockCash = Math.max(0, Math.round(stockCash * (1 + finalPct / 100)));
            }

            // 결과 안내 출력
            const resultBox = document.getElementById('newsResult');
            resultBox.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-300', 'bg-rose-500/20', 'text-rose-300', 'bg-slate-700', 'text-slate-300');
            
            let resultText = "";
            if (isFake) {
                resultText += "🚨 [찌라시 속보!] 해당 뉴스는 세력의 가짜 뉴스로 밝혀졌습니다!\n";
            }
            resultText += `결과: 주가가 ${finalPct > 0 ? '+' : ''}${finalPct}% 변동했습니다.`;
            
            if (finalPct > 0) {
                resultBox.classList.add('bg-emerald-500/20', 'text-emerald-300');
            } else if (finalPct < 0) {
                resultBox.classList.add('bg-rose-500/20', 'text-rose-300');
            } else {
                resultBox.classList.add('bg-slate-700', 'text-slate-300');
            }
            resultBox.innerText = resultText;

            // 데이터 기록 및 다음 턴 준비
            const totalAsset = cash + stockCash;
            assetChart.data.labels.push(`${turn}턴`);
            assetChart.data.datasets[0].data.push(totalAsset);
            assetChart.update();

            // 판정
            if (totalAsset <= 0) {
                setTimeout(() => alert("💸 자산이 0원이 되어 파산하셨습니다!"), 100);
                disableGame();
                return;
            }

            if (totalAsset >= 300000) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                setTimeout(() => alert(`🎉 축하합니다! ${turn}턴 만에 30만 원을 달성하여 투자왕이 되셨습니다!`), 100);
                disableGame();
                return;
            }

            turn++;
            if (turn > 15) {
                setTimeout(() => alert(`⏰ 게임 마감! 최종 자산: ${totalAsset.toLocaleString()}원`), 100);
                disableGame();
                return;
            }

            updateUI();
            setTimeout(initTurn, 1200); // 1.2초 뒤 다음 턴 뉴스로 이동
        }

        // UI 업데이트
        function updateUI() {
            document.getElementById('turnDisplay').innerText = `${turn} / 15`;
            document.getElementById('cashDisplay').innerText = `${cash.toLocaleString()}원`;
            document.getElementById('stockCashDisplay').innerText = `${stockCash.toLocaleString()}원`;
            
            const total = cash + stockCash;
            document.getElementById('totalAssetDisplay').innerText = `${total.toLocaleString()}원`;

            // 모멘텀 UI 표시
            const mBox = document.getElementById('momentumDisplay');
            if (momentum > 0) {
                mBox.innerHTML = `<span class="text-rose-400 font-bold">🔥 상승 모멘텀 (+${momentum})</span>`;
            } else if (momentum < 0) {
                mBox.innerHTML = `<span class="text-blue-400 font-bold">❄️ 하락 모멘텀 (${momentum})</span>`;
            } else {
                mBox.innerHTML = `<span class="text-slate-400">⚖️ 중립</span>`;
            }
        }

        function disableGame() {
            document.getElementById('buyBtn').disabled = true;
            document.getElementById('holdBtn').disabled = true;
            document.getElementById('sellBtn').disabled = true;
        }

        // 게임 시작
        window.onload = initTurn;
    </script>
</body>
</html>
