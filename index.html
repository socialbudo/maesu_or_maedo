<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투자왕이 되자! - 롱/숏 익스트림 에디션</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
        <!-- 헤더 -->
        <div class="bg-gradient-to-r from-emerald-600 via-indigo-600 to-rose-600 p-6 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight flex items-center justify-center gap-2">
                <i data-lucide="candlestick-chart" class="w-8 h-8 text-yellow-300"></i> 투자왕이 되자! (롱/숏 선물)
            </h1>
            <p class="text-indigo-200 text-sm mt-1">상승에 거는 롱(LONG)! 하락에 거는 숏(SHORT)! 방향을 맞춰라!</p>
        </div>

        <!-- 게임 상태 대시보드 -->
        <div class="p-6 space-y-5">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">진행 턴</span>
                    <span id="turnDisplay" class="text-lg font-bold text-amber-400">1 / 15</span>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">보유 현금</span>
                    <span id="cashDisplay" class="text-lg font-bold text-emerald-400">100,000원</span>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">투자 포지션</span>
                    <span id="stockCashDisplay" class="text-lg font-bold text-blue-400">0원</span>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">총 자산</span>
                    <span id="totalAssetDisplay" class="text-lg font-bold text-rose-400">100,000원</span>
                </div>
            </div>

            <!-- 그래프 모드 전환 탭 및 차트 영역 -->
            <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-700 space-y-2">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs font-semibold text-slate-400 flex items-center gap-1">
                        <i data-lucide="line-chart" class="w-3.5 h-3.5"></i> 차트 뷰 스타일
                    </span>
                    <div class="flex gap-1">
                        <button onclick="switchChartMode('line')" id="btnLineChart" class="px-2.5 py-1 text-xs font-bold rounded bg-indigo-600 text-white transition">선 그래프</button>
                        <button onclick="switchChartMode('btc')" id="btnBtcChart" class="px-2.5 py-1 text-xs font-bold rounded bg-slate-700 text-slate-300 transition">비트코인 스타일</button>
                    </div>
                </div>
                <div class="h-40 relative">
                    <canvas id="assetChart"></canvas>
                </div>
            </div>

            <!-- 뉴스 & 이벤트 패널 -->
            <div id="newsPanel" class="bg-slate-900 p-4 rounded-xl border border-indigo-500/40 shadow-inner space-y-2">
                <div class="flex items-center gap-2 text-amber-400 font-bold text-base">
                    <i data-lucide="newspaper" class="w-5 h-5 text-amber-500 shrink-0"></i>
                    <span id="newsTitle">시장 대기 중...</span>
                </div>
                <p id="newsDesc" class="text-slate-300 text-xs sm:text-sm leading-relaxed">롱(상승) 혹은 숏(하락) 포지션을 잡고 뉴스의 방향을 예측하세요!</p>
                <div class="pt-2 border-t border-slate-800 flex items-center justify-between">
                    <span class="text-[11px] text-indigo-300 font-medium flex items-center gap-1">
                        <i data-lucide="shield-alert" class="w-3.5 h-3.5 shrink-0"></i> 💡 가짜 뉴스 확률 25% 적용 중!
                    </span>
                </div>
            </div>

            <!-- 롱 / 숏 포지션 선택 패널 -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="selectPosition('LONG')" id="btnLong" class="py-3 px-4 rounded-xl font-extrabold bg-slate-700 hover:bg-emerald-600 transition text-sm flex items-center justify-center gap-2 border border-slate-600">
                    <i data-lucide="trending-up" class="w-5 h-5 text-emerald-400"></i> 🟢 롱 (상승에 베팅)
                </button>
                <button onclick="selectPosition('SHORT')" id="btnShort" class="py-3 px-4 rounded-xl font-extrabold bg-slate-700 hover:bg-rose-600 transition text-sm flex items-center justify-center gap-2 border border-slate-600">
                    <i data-lucide="trending-down" class="w-5 h-5 text-rose-400"></i> 🔴 숏 (하락에 베팅)
                </button>
            </div>

            <!-- 컨트롤 패널 (금액 입력 및 실행) -->
            <div id="controlPanel" class="space-y-3">
                <div class="flex gap-2 items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-700">
                    <span id="positionIndicator" class="text-xs font-bold text-emerald-400 whitespace-nowrap bg-slate-800 px-2.5 py-1 rounded">선택: 롱(LONG)</span>
                    <input type="number" id="actionAmount" placeholder="투자할 금액 입력 (비워두면 전액)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="executeTrade()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition shrink-0">포지션 진입</button>
                </div>
            </div>

            <!-- 결과 로그 -->
            <div id="resultLog" class="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-lg border border-slate-800 min-h-[45px] flex items-center leading-relaxed">
                롱 또는 숏 포지션을 선택하고 금액을 입력한 뒤 포지션 진입을 누르세요!
            </div>
        </div>
    </div>

    <!-- 게임 종료 모달 -->
    <div id="endModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl text-center space-y-4">
            <h2 id="modalTitle" class="text-2xl font-bold">게임 종료</h2>
            <div id="rankBadge" class="inline-block px-4 py-1.5 rounded-full text-base font-extrabold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">등급: -</div>
            <p id="modalDesc" class="text-slate-300 text-sm leading-relaxed">결과 내용</p>
            <button onclick="restartGame()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition">다시 도전하기</button>
        </div>
    </div>

    <script>
        let turn = 1;
        let cash = 100000;
        let stockCash = 0;
        let currentPosition = 'LONG';
        let stockPrice = 10000;
        let assetHistory = [100000];
        let chartStyle = 'line';

        const uniqueNewsPool = [
            { title: "🚀 꿈의 신기술 특허 최종 승인!", desc: "A사가 혁신적인 배터리 특허를 취득하며 폭등 조짐이 보입니다.", min: 10, max: 40 },
            { title: "💼 글로벌 대기업과 5조 원 공급 계약!", desc: "거대 빅테크 기업이 A사의 제품을 단독 채택했습니다.", min: 15, max: 45 },
            { title: "🏛️ 정부의 파격적인 세제 면제 및 보조금 혜택", desc: "국가대표 유망 기업으로 선정되어 막대한 지원금을 받습니다.", min: 10, max: 30 },
            { title: "🔥 메인 공장 대형 화재 발생 (생산 중단)", desc: "핵심 생산 라인이 불타버려 주가 폭락 위기에 처했습니다.", min: -40, max: -15 },
            { title: "⚖️ 대표이사 긴급 구속 및 비리 수사", desc: "오너 리스크가 터지면서 거센 충격파가 몰아칩니다.", min: -45, max: -20 },
            { title: "🦠 창사 이래 최악의 개인정보 유출", desc: "해킹 공격으로 집단 소송 위기에 처했습니다.", min: -35, max: -15 },
            { title: "📊 어닝 서프라이즈! 영업이익 300% 폭증", desc: "시장 예상치를 뛰어넘는 역대급 실적입니다.", min: 12, max: 40 },
            { title: "📉 주요 기관 투자자들의 전량 매도 폭탄", desc: "큰손들이 물량을 던지며 하방 압력이 거세졌습니다.", min: -35, max: -10 }
        ];

        let currentNews = null;
        let chart;

        function initChart() {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: chartStyle === 'btc' ? 'bar' : 'line',
                data: {
                    labels: ['시작'],
                    datasets: [{
                        label: '총 자산',
                        data: assetHistory,
                        borderColor: '#6366f1',
                        backgroundColor: chartStyle === 'btc' ? 'rgba(59, 130, 246, 0.5)' : 'rgba(99, 102, 241, 0.1)',
                        borderWidth: 2,
                        fill: chartStyle !== 'btc',
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
                    }
                }
            });
        }

        function switchChartMode(mode) {
            chartStyle = mode;
            const btnLine = document.getElementById('btnLineChart');
            const btnBtc = document.getElementById('btnBtcChart');
            if (mode === 'line') {
                btnLine.className = "px-2.5 py-1 text-xs font-bold rounded bg-indigo-600 text-white transition";
                btnBtc.className = "px-2.5 py-1 text-xs font-bold rounded bg-slate-700 text-slate-300 transition";
            } else {
                btnLine.className = "px-2.5 py-1 text-xs font-bold rounded bg-slate-700 text-slate-300 transition";
                btnBtc.className = "px-2.5 py-1 text-xs font-bold rounded bg-indigo-600 text-white transition";
            }
            initChart();
            updateUI();
        }

        function pickNewNews() {
            currentNews = uniqueNewsPool[Math.floor(Math.random() * uniqueNewsPool.length)];
            document.getElementById('newsTitle').innerText = currentNews.title;
            document.getElementById('newsDesc').innerText = currentNews.desc;
        }

        function selectPosition(pos) {
            currentPosition = pos;
            const btnLong = document.getElementById('btnLong');
            const btnShort = document.getElementById('btnShort');
            const indicator = document.getElementById('positionIndicator');

            if (pos === 'LONG') {
                btnLong.className = "py-3 px-4 rounded-xl font-extrabold bg-emerald-600 text-white transition text-sm flex items-center justify-center gap-2 border border-emerald-500 shadow-lg shadow-emerald-900/40";
                btnShort.className = "py-3 px-4 rounded-xl font-extrabold bg-slate-700 hover:bg-rose-600/50 transition text-sm flex items-center justify-center gap-2 border border-slate-600";
                indicator.innerText = "선택: 롱(LONG)";
                indicator.className = "text-xs font-bold text-emerald-400 whitespace-nowrap bg-slate-800 px-2.5 py-1 rounded";
            } else {
                btnLong.className = "py-3 px-4 rounded-xl font-extrabold bg-slate-700 hover:bg-emerald-600/50 transition text-sm flex items-center justify-center gap-1 border border-slate-600";
                btnShort.className = "py-3 px-4 rounded-xl font-extrabold bg-rose-600 text-white transition text-sm flex items-center justify-center gap-2 border border-rose-500 shadow-lg shadow-rose-900/40";
                indicator.innerText = "선택: 숏(SHORT)";
                indicator.className = "text-xs font-bold text-rose-400 whitespace-nowrap bg-slate-800 px-2.5 py-1 rounded";
            }
        }

        function executeTrade() {
            const val = document.getElementById('actionAmount').value;
            const amount = val === "" ? cash : parseInt(val);

            if (cash <= 0 && stockCash <= 0) {
                document.getElementById('resultLog').innerText = "❌ 자산이 없어 포지션을 잡을 수 없습니다!";
                return;
            }

            if (isNaN(amount) || amount <= 0 || amount > cash + stockCash) {
                document.getElementById('resultLog').innerText = "❌ 올바른 투자 금액을 입력해주세요.";
                return;
            }

            let totalAvailable = cash + stockCash;
            cash = totalAvailable - amount;
            stockCash = amount;

            processTurn();
        }

        function processTurn() {
            // 수정 완료: 25% 확률로 가짜 뉴스 반전
            const isFake = Math.random() < 0.25;
            let rawPct = (Math.random() * (currentNews.max - currentNews.min) + currentNews.min);
            if (isFake) rawPct = -rawPct;
            const fluctuation = Math.round(rawPct * 10) / 10;

            let pnlPercent = 0;
            if (currentPosition === 'LONG') {
                pnlPercent = fluctuation;
            } else {
                pnlPercent = -fluctuation;
            }

            if (stockCash > 0) {
                let profitLoss = Math.round(stockCash * (pnlPercent / 100));
                stockCash += profitLoss;
                if (stockCash < 0) stockCash = 0;
            }

            stockPrice = Math.max(100, Math.round(stockPrice * (1 + fluctuation / 100)));
            let totalAsset = cash + stockCash;
            assetHistory.push(totalAsset);

            let resultHtml = `[${currentPosition} 포지션] 시장 변동: <b class="${fluctuation >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${fluctuation > 0 ? '+' + fluctuation : fluctuation}%</b><br>`;
            if (isFake) {
                resultHtml += `🚨 <b class="text-amber-400">[25% 확률 가짜 뉴스 반전!]</b> 세력의 속임수! (수익률: <b class="${pnlPercent >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnlPercent > 0 ? '+' + pnlPercent : pnlPercent}%</b>)`;
            } else {
                resultHtml += `✨ <b class="text-blue-400">[진짜 뉴스 적중!]</b> (수익률: <b class="${pnlPercent >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnlPercent > 0 ? '+' + pnlPercent : pnlPercent}%</b>)`;
            }

            document.getElementById('resultLog').innerHTML = resultHtml;

            updateUI();
            checkGameCondition(totalAsset);

            if (turn <= 15 && totalAsset > 0 && totalAsset < 300000) {
                pickNewNews();
            }
        }

        function updateUI() {
            let totalAsset = cash + stockCash;
            document.getElementById('turnDisplay').innerText = `${turn} / 15`;
            document.getElementById('cashDisplay').innerText = `${cash.toLocaleString()}원`;
            document.getElementById('stockCashDisplay').innerText = `${stockCash.toLocaleString()}원`;
            document.getElementById('totalAssetDisplay').innerText = `${totalAsset.toLocaleString()}원`;

            chart.data.labels.push(turn);
            chart.data.datasets[0].data = assetHistory;
            chart.update();
        }

        function getRank(totalAsset) {
            if (totalAsset >= 300000) return { grade: "S", color: "bg-yellow-500/20 text-yellow-300 border-yellow-500/40", title: "S등급: 비트코인 선물 마스터 👑" };
            if (totalAsset >= 200000) return { grade: "A", color: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40", title: "A등급: 방향 예측의 신 🌟" };
            if (totalAsset >= 150000) return { grade: "B", color: "bg-blue-500/20 text-blue-300 border-blue-500/40", title: "B등급: 우상향 탑승 성공 📈" };
            if (totalAsset >= 100000) return { grade: "C", color: "bg-slate-500/20 text-slate-300 border-slate-500/40", title: "C등급: 본전 지킴이 😐" };
            if (totalAsset > 0) return { grade: "D", color: "bg-orange-500/20 text-orange-300 border-orange-500/40", title: "D등급: 물려서 청산 위기 💧" };
            return { grade: "F", color: "bg-rose-500/20 text-rose-300 border-rose-500/40", title: "F등급: 강제 청산(파산) 당함 💀" };
        }

        function checkGameCondition(totalAsset) {
            if (totalAsset <= 0) {
                showModal("💸 강제 청산 (파산!)", totalAsset);
                return;
            }
            if (totalAsset >= 300000) {
                showModal("🏆 30만 원 목표 달성!", totalAsset);
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                return;
            }

            turn++;
            if (turn > 15) {
                showModal("⏰ 15턴 장 마감!", totalAsset);
            }
        }

        function showModal(title, totalAsset) {
            const rank = getRank(totalAsset);
            document.getElementById('modalTitle').innerText = title;
            
            const badge = document.getElementById('rankBadge');
            badge.className = `inline-block px-4 py-1.5 rounded-full text-base font-extrabold border ${rank.color}`;
            badge.innerText = rank.title;

            let diff = totalAsset - 100000;
            let profitStr = diff >= 0 ? `+${diff.toLocaleString()}원 수익` : `${diff.toLocaleString()}원 손실`;
            document.getElementById('modalDesc').innerText = `최종 자산: ${totalAsset.toLocaleString()}원 (${profitStr})`;

            document.getElementById('endModal').classList.remove('hidden');
            document.getElementById('endModal').classList.add('flex');
            document.getElementById('controlPanel').style.display = 'none';
        }

        function restartGame() {
            turn = 1;
            cash = 100000;
            stockCash = 0;
            stockPrice = 10000;
            assetHistory = [100000];
            document.getElementById('endModal').classList.remove('flex');
            document.getElementById('endModal').classList.add('hidden');
            document.getElementById('controlPanel').style.display = 'block';
            document.getElementById('resultLog').innerText = "새로운 게임이 시작되었습니다! 포지션을 선택하세요.";
            selectPosition('LONG');
            pickNewNews();
            initChart();
            updateUI();
        }

        window.onload = () => {
            lucide.createIcons();
            initChart();
            selectPosition('LONG');
            pickNewNews();
            updateUI();
        };
    </script>
</body>
</html>
